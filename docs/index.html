<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google One 激活链接活性批量检测</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        google: {
                            blue: '#1a73e8',
                            hover: '#1557b0',
                            green: '#1e8e3e',
                            red: '#d93025'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .font-code { font-family: 'JetBrains Mono', Consolas, monospace; }
        .card-active {
            border-left: 4px solid #10b981 !important;
            background: linear-gradient(to right, rgba(236, 253, 245, 0.9), rgba(255, 255, 255, 0.98)) !important;
        }
        .card-used {
            border-left: 4px solid #f43f5e !important;
            background: linear-gradient(to right, rgba(254, 242, 242, 0.9), rgba(255, 255, 255, 0.98)) !important;
        }
        .card-other {
            border-left: 4px solid #f59e0b !important;
            background: linear-gradient(to right, rgba(255, 251, 235, 0.9), rgba(255, 255, 255, 0.98)) !important;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 flex flex-col antialiased">

    <!-- 顶部导航栏 (手机端极简紧凑) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-3.5 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-xs">
                    1
                </div>
                <div>
                    <h1 class="text-sm font-bold text-slate-900 leading-tight">Google One 链接检测</h1>
                    <p class="text-[10px] text-slate-500 font-medium">Jio 18个月 AI Pro 活性与时效</p>
                </div>
            </div>

            <!-- 右侧操作 -->
            <div class="flex items-center space-x-1.5">
                <button onclick="openHelpModal()" class="px-2 py-1 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition flex items-center space-x-0.5">
                    <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>教程</span>
                </button>
                <button onclick="openSettingsModal()" class="px-2.5 py-1 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-xs transition flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>配置</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="max-w-4xl mx-auto px-3.5 py-3 space-y-3 flex-1 w-full">
        
        <!-- 紧凑单行统计栏 (替代之前的5大卡片) -->
        <div class="bg-white rounded-xl p-2.5 shadow-xs border border-slate-200 flex items-center justify-around text-center text-xs">
            <div class="flex-1 border-r border-slate-100">
                <div class="text-[10px] text-slate-400 font-medium">总链接</div>
                <div id="statTotal" class="text-sm font-bold text-slate-800">0</div>
            </div>
            <div class="flex-1 border-r border-slate-100">
                <div class="text-[10px] text-emerald-600 font-medium">🟢 有效</div>
                <div id="statActive" class="text-sm font-bold text-emerald-600">0</div>
            </div>
            <div class="flex-1 border-r border-slate-100">
                <div class="text-[10px] text-rose-600 font-medium">🔴 已失效</div>
                <div id="statUsed" class="text-sm font-bold text-rose-600">0</div>
            </div>
            <div class="flex-1">
                <div class="text-[10px] text-indigo-600 font-medium">⚡ 进度</div>
                <div id="statProgressPercent" class="text-sm font-bold text-indigo-600">0%</div>
            </div>
        </div>

        <!-- 进度条 -->
        <div id="progressBarContainer" class="hidden w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
        </div>

        <!-- 输入卡片 -->
        <div class="bg-white rounded-xl p-3 shadow-xs border border-slate-200 space-y-2.5">
            <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-slate-800 flex items-center space-x-1">
                    <span>待检测链接</span>
                    <span id="inputCountBadge" class="text-[10px] px-1.5 py-0.5 rounded-full bg-blue-50 text-blue-700 font-semibold">0条</span>
                </span>
                <div class="flex items-center space-x-1.5">
                    <button onclick="fillSampleLinks()" class="px-2 py-0.5 text-[11px] font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded transition">
                        示例
                    </button>
                    <button onclick="clearInput()" class="px-2 py-0.5 text-[11px] font-medium text-slate-500 bg-slate-100 hover:bg-slate-200 rounded transition">
                        清空
                    </button>
                </div>
            </div>

            <!-- 紧凑输入框 -->
            <textarea id="linksInput" rows="3" placeholder="每行一条链接：&#10;https://serviceactivation.google.com/subscription/new/AQCpiI...&#10;https://serviceactivation.google.com/subscription/new/AQCPii..." 
                class="w-full px-3 py-2 text-xs text-slate-800 bg-slate-50 border border-slate-200 rounded-lg focus:ring-1 focus:ring-blue-500 focus:bg-white focus:outline-none transition font-code"
                oninput="updateInputCount()"></textarea>

            <!-- 操作按钮 -->
            <div class="flex items-center space-x-2 pt-0.5">
                <button id="stopBtn" onclick="stopCheck()" disabled class="w-20 py-2 text-xs font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 disabled:opacity-40 rounded-lg transition">
                    停止
                </button>
                <button id="startBtn" onclick="startCheck()" class="flex-1 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 rounded-lg shadow-sm transition flex items-center justify-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span>开始批量检测</span>
                </button>
            </div>
        </div>

        <!-- 结果列表卡片容器 -->
        <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden space-y-0">
            <!-- 过滤栏 -->
            <div class="p-2.5 border-b border-slate-100 flex items-center justify-between text-xs gap-1">
                <div class="flex items-center space-x-1">
                    <button onclick="setFilter('ALL')" id="filterBtn_ALL" class="filter-tab px-2.5 py-1 text-[11px] font-semibold rounded-md bg-blue-600 text-white transition">全部 (<span id="tabCountALL">0</span>)</button>
                    <button onclick="setFilter('ACTIVE')" id="filterBtn_ACTIVE" class="filter-tab px-2.5 py-1 text-[11px] font-semibold rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition">🟢 有效 (<span id="tabCountACTIVE">0</span>)</button>
                    <button onclick="setFilter('USED')" id="filterBtn_USED" class="filter-tab px-2.5 py-1 text-[11px] font-semibold rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 transition">🔴 失效 (<span id="tabCountUSED">0</span>)</button>
                </div>
                <button onclick="copyActiveLinks()" class="px-2.5 py-1 text-[11px] font-semibold text-emerald-800 bg-emerald-100 hover:bg-emerald-200 rounded-md transition flex items-center space-x-1">
                    <span>复制有效</span>
                </button>
            </div>

            <!-- 手机端卡片列表 -->
            <div id="resultsContainer" class="p-2 space-y-2 max-h-[500px] overflow-y-auto">
                <div class="py-10 text-center text-xs text-slate-400">
                    暂无数据，在上方粘贴链接并点击「开始批量检测」
                </div>
            </div>
        </div>
    </main>

    <!-- 配置模态框 (Modal) -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3">
        <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-4 space-y-3 border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="text-sm font-bold text-slate-900 flex items-center space-x-1">
                    <span>⚙️</span>
                    <span>配置 Google 账号 Cookie</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="space-y-2 text-xs">
                <div>
                    <label class="font-semibold text-slate-700 block mb-1">Google Cookie (自动保存在手机本地)</label>
                    <textarea id="cfgCookie" rows="5" placeholder="请粘贴在电脑/浏览器中复制的完整 Cookie 字符串" class="w-full px-2.5 py-2 border border-slate-200 rounded-lg text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none font-code"></textarea>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-100">
                <button onclick="closeSettingsModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="saveSettings()" class="px-4 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-xs">保存</button>
            </div>
        </div>
    </div>

    <!-- 教程模态框 -->
    <div id="helpModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3">
        <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-4 space-y-3 border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="text-sm font-bold text-slate-900 flex items-center space-x-1">
                    <span>📖</span>
                    <span>手机如何填入 Cookie？</span>
                </h3>
                <button onclick="closeHelpModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="text-xs text-slate-600 space-y-2 leading-relaxed">
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1 font-code text-[11px] text-slate-700">
                    <div class="font-semibold text-blue-600">推荐方法：电脑复制发给手机</div>
                    <div>1. 在电脑 Chrome 打开 one.google.com 登录；</div>
                    <div>2. 按 F12 在 Network 中复制 Cookie；</div>
                    <div>3. 发到手机微信/QQ并复制，点击右上角「配置」粘贴保存即可！</div>
                </div>
            </div>

            <div class="flex justify-end pt-2 border-t border-slate-100">
                <button onclick="closeHelpModal()" class="px-4 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg">我明白了</button>
            </div>
        </div>
    </div>

    <!-- 业务逻辑 JS -->
    <script>
        let userCookie = localStorage.getItem('g1_cookie') || '';
        let proxyGateway = localStorage.getItem('g1_proxy_gateway') || '';
        let isStopRequested = false;
        let allResults = [];
        let currentFilter = 'ALL';

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cfgCookie').value = userCookie;
            updateInputCount();
        });

        function saveSettings() {
            userCookie = document.getElementById('cfgCookie').value.trim();
            localStorage.setItem('g1_cookie', userCookie);
            closeSettingsModal();
            alert('Cookie 已成功保存！');
        }

        function updateInputCount() {
            const text = document.getElementById('linksInput').value.trim();
            const lines = text ? text.split('\n').map(l => l.trim()).filter(l => l.length > 0) : [];
            document.getElementById('inputCountBadge').innerText = `${lines.length}条`;
        }

        function fillSampleLinks() {
            const samples = [
                "https://serviceactivation.google.com/subscription/new/AQCpiIHej8nqT7bayckk8a6QsgOuffjUBADAo-4A8Ia3TsfCNYphRcd0hE5zILnOOq9HRDQiSInJosMvZnBuT2ExTq5s2fmevPRpZAoKjmIOr9_GiavfPjcw-AHoHB8yOT48znWhbKwS-2DacScVyxwfsT9xNtu_MEXCLa8wR4cahayECj1Bx1nERrOw4MFjriA0calOqMuzsYhbjXlEosZ2oCf2MDsIbUb0_h6WxrQXZZASnDjpqe4uCeLvTrOFuz31RO3skeK2Eap7Fg==",
                "https://serviceactivation.google.com/subscription/new/AQCPiiH3Zc2aLnxLQkIAYVANazjvAK6pHpcG9JtkCYazlAhCE3XY7J4HM8luA8chZMfFepePNNRUmFWHnJdtnb_DF3IiQM009vbTKpXPrzJ6XskoAy1mqznz4TxvatWErMwtBAPS-vGffWiUfcS-e8dOe_fELJWZB6jjmnFO7MVdlGIJfkogsipNK5U0vmdei2Kj6gJWJ-zgpvtEJjnaOMCJBlzvoQybbZMFW1162O-pijWfY3TEcwyHWnZTXrGyKFJEmbZBrEhnipZPNQ=="
            ];
            document.getElementById('linksInput').value = samples.join('\n');
            updateInputCount();
        }

        function clearInput() {
            document.getElementById('linksInput').value = '';
            updateInputCount();
        }

        function extractTokenAndUrl(raw) {
            raw = raw.trim();
            const urlMatch = raw.match(/https?:\/\/[^\s]+/);
            let url = urlMatch ? urlMatch[0] : raw;
            const tokenMatch = url.match(/(?:subscription\/new\/|activate-plan\/subscription\/new\/)([A-Za-z0-9_\-+=]+)/);
            let token = tokenMatch ? tokenMatch[1] : (url.length > 20 ? url : '');
            let normalizedUrl = `https://one.google.com/activate-plan/subscription/new/${token}`;
            let snippet = token.length > 16 ? `${token.slice(0, 7)}...${token.slice(-6)}` : (token || '-');
            return { token, normalizedUrl, snippet };
        }

        function analyzeHtml(rawInput, token, snippet, targetUrl, html, finalUrl, durationMs, index) {
            if (finalUrl && (finalUrl.includes('accounts.google.com/ServiceLogin') || finalUrl.includes('accounts.google.com/v3/signin'))) {
                return {
                    index, raw_input: rawInput, token, token_snippet: snippet, url: targetUrl,
                    status: 'NEED_AUTH', status_badge: '🟡 需配置 Cookie',
                    details: '请点击右上角「配置」填入 Google Cookie',
                    plan_info: '需 Google Cookie', expire_deadline: '-', remaining_time: '-', duration_ms: durationMs
                };
            }

            let expireDeadline = '-';
            let remainingTime = '-';
            const m1 = html.match(/(?:优惠[\u4e00-\u9fa5]*[，,]\s*)?(\d{1,2})\s*月\s*(\d{1,2})\s*日截止/);
            if (m1) {
                const month = parseInt(m1[1]);
                const day = parseInt(m1[2]);
                const now = new Date();
                let expDate = new Date(now.getFullYear(), month - 1, day, 23, 59, 59);
                if (now > expDate && (now - expDate) > 60 * 86400000) {
                    expDate = new Date(now.getFullYear() + 1, month - 1, day, 23, 59, 59);
                }
                expireDeadline = `${month}月${day}日截止`;
                const diff = expDate - now;
                if (diff > 0) {
                    const days = Math.floor(diff / 86400000);
                    const hours = Math.floor((diff % 86400000) / 3600000);
                    remainingTime = days > 0 ? `还剩 ${days} 天 ${hours} 小时` : `还剩 ${hours} 小时`;
                } else {
                    remainingTime = '已到期失效';
                }
            }

            const usedKeywords = ['订阅已在使用中', '此订阅链接已被使用', '已被使用', '探索 Google One', 'Subscription is already in use', 'This subscription link has already been used', 'already in use'];
            for (const kw of usedKeywords) {
                if (html.includes(kw)) {
                    return {
                        index, raw_input: rawInput, token, token_snippet: snippet, url: targetUrl,
                        status: 'USED', status_badge: '🔴 已失效 · 已使用',
                        details: '此订阅链接已被兑换失效',
                        plan_info: '已失效', expire_deadline: '已失效', remaining_time: '已失效', duration_ms: durationMs
                    };
                }
            }

            const activeKeywords = ['激活Jio提供的Google AI Pro方案', 'Jio提供的Google AI Pro方案', 'Google AI Pro方案', '免费畅享 18 个月', '免费畅享 18', 'Nano Banana Pro', '5 TB', '切换方案', '立即激活', 'Jio', 'free for 18 months'];
            for (const kw of activeKeywords) {
                if (html.includes(kw)) {
                    return {
                        index, raw_input: rawInput, token, token_snippet: snippet, url: targetUrl,
                        status: 'ACTIVE', status_badge: '🟢 有效 · 可激活',
                        details: `链接有效！可免费畅享 18 个月 (5TB)`,
                        plan_info: 'Jio 18个月 AI Pro (5TB)', expire_deadline: expireDeadline, remaining_time: remainingTime, duration_ms: durationMs
                    };
                }
            }

            if (html.includes('one.google.com') || html.includes('Google One')) {
                return {
                    index, raw_input: rawInput, token, token_snippet: snippet, url: targetUrl,
                    status: 'ACTIVE', status_badge: '🟢 有效 · 可激活',
                    details: '检测到 Google One 激活页面（有效）',
                    plan_info: 'Google AI 方案', expire_deadline: expireDeadline, remaining_time: remainingTime, duration_ms: durationMs
                };
            }

            return {
                index, raw_input: rawInput, token, token_snippet: snippet, url: targetUrl,
                status: 'ERROR', status_badge: '❌ 异常',
                details: '未能识别页面，请确认 Cookie 是否有效',
                plan_info: '-', expire_deadline: '-', remaining_time: '-', duration_ms: durationMs
            };
        }

        async function fetchLink(rawInput, index) {
            const { token, normalizedUrl, snippet } = extractTokenAndUrl(rawInput);
            if (!token) {
                return {
                    index, raw_input: rawInput, token: '', token_snippet: '-', url: '',
                    status: 'INVALID', status_badge: '⚠️ 无效', details: '无法识别有效链接', plan_info: '-', expire_deadline: '-', remaining_time: '-', duration_ms: 0
                };
            }

            const startTime = Date.now();
            const gateway = proxyGateway.trim() || 'https://corsproxy.io/?url=';

            try {
                let resHtml = '';
                let finalUrl = '';
                const reqUrl = gateway + encodeURIComponent(normalizedUrl);
                const resp = await fetch(reqUrl, {
                    headers: {
                        'x-requested-with': 'XMLHttpRequest',
                        ...(userCookie ? { 'cookie': userCookie } : {})
                    }
                });
                resHtml = await resp.text();
                finalUrl = resp.url;
                const dur = Date.now() - startTime;
                return analyzeHtml(rawInput, token, snippet, normalizedUrl, resHtml, finalUrl, dur, index);
            } catch (err) {
                const dur = Date.now() - startTime;
                return {
                    index, raw_input: rawInput, token, token_snippet: snippet, url: normalizedUrl,
                    status: 'ERROR', status_badge: '❌ 异常', details: `网络异常: ${err.message}`, plan_info: '-', expire_deadline: '-', remaining_time: '-', duration_ms: dur
                };
            }
        }

        async function startCheck() {
            const text = document.getElementById('linksInput').value.trim();
            if (!text) { alert('请先输入待检测的激活链接！'); return; }

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) { alert('没有有效链接！'); return; }

            allResults = [];
            renderCards();
            updateStats(lines.length, 0, 0, 0);

            isStopRequested = false;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').classList.add('opacity-50');
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('progressBarContainer').classList.remove('hidden');

            let completed = 0;
            const concurrency = 2;

            for (let i = 0; i < lines.length; i += concurrency) {
                if (isStopRequested) break;
                const chunk = lines.slice(i, i + concurrency);
                const promises = chunk.map((line, chunkIdx) => fetchLink(line, i + chunkIdx + 1));
                const chunkResults = await Promise.all(promises);

                allResults.push(...chunkResults);
                allResults.sort((a, b) => a.index - b.index);
                completed += chunk.length;

                renderCards();
                updateStatsFromResults(lines.length);

                const pct = Math.round((completed / lines.length) * 100);
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('statProgressPercent').innerText = pct + '%';
            }

            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').classList.remove('opacity-50');
            document.getElementById('stopBtn').disabled = true;
        }

        function stopCheck() { isStopRequested = true; }

        function updateStatsFromResults(total) {
            const active = allResults.filter(r => r.status === 'ACTIVE').length;
            const used = allResults.filter(r => r.status === 'USED').length;
            updateStats(total, active, used);
        }

        function updateStats(total, active, used) {
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statActive').innerText = active;
            document.getElementById('statUsed').innerText = used;
            document.getElementById('tabCountALL').innerText = allResults.length;
            document.getElementById('tabCountACTIVE').innerText = active;
            document.getElementById('tabCountUSED').innerText = used;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(b => {
                b.className = 'filter-tab px-2.5 py-1 text-[11px] font-semibold rounded-md bg-slate-100 text-slate-700 transition';
            });
            const activeBtn = document.getElementById(`filterBtn_${filter}`);
            if (activeBtn) activeBtn.className = 'filter-tab px-2.5 py-1 text-[11px] font-semibold rounded-md bg-blue-600 text-white transition';
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('resultsContainer');
            let filtered = allResults;
            if (currentFilter === 'ACTIVE') filtered = allResults.filter(r => r.status === 'ACTIVE');
            else if (currentFilter === 'USED') filtered = allResults.filter(r => r.status === 'USED');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-8 text-center text-xs text-slate-400">${allResults.length === 0 ? '暂无数据' : '当前筛选无结果'}</div>`;
                return;
            }

            let html = '';
            filtered.forEach((r) => {
                let cardBorderClass = 'card-other';
                let statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-500 text-white">异常</span>`;
                let remainBadge = '';

                if (r.status === 'ACTIVE') {
                    cardBorderClass = 'card-active';
                    statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-600 text-white animate-pulse">🟢 有效</span>`;
                    remainBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">⏳ ${escapeHtml(r.remaining_time || '有效')}</span>`;
                } else if (r.status === 'USED') {
                    cardBorderClass = 'card-used';
                    statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-600 text-white">🔴 已失效</span>`;
                    remainBadge = `<span class="text-[10px] text-rose-500 font-semibold">已兑换</span>`;
                } else if (r.status === 'NEED_AUTH') {
                    statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500 text-white">需Cookie</span>`;
                }

                const snippet = r.token_snippet || '-';
                const fullUrl = r.url || r.raw_input || '';

                html += `
                    <div class="p-3 rounded-lg border border-slate-200/80 shadow-2xs space-y-1.5 ${cardBorderClass}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-1.5">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold font-code bg-slate-200 text-slate-700">#${r.index}</span>
                                ${statusBadge}
                                ${remainBadge}
                            </div>
                            <span class="text-[10px] text-slate-400 font-code">${r.duration_ms || 0}ms</span>
                        </div>

                        <div class="flex items-center justify-between text-xs pt-0.5">
                            <span class="font-code text-[11px] font-semibold text-slate-800 bg-white/80 px-1.5 py-0.5 rounded border border-slate-200">
                                🔑 ${escapeHtml(snippet)}
                            </span>
                            <div class="flex items-center space-x-1.5">
                                <button onclick="copyToClipboard('${escapeJs(fullUrl)}')" class="px-2 py-1 text-[11px] font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 rounded transition">
                                    复制
                                </button>
                                <a href="${escapeHtml(fullUrl)}" target="_blank" class="px-2 py-1 text-[11px] font-semibold text-slate-700 bg-white hover:bg-slate-100 rounded border border-slate-200 transition">
                                    打开 ↗
                                </a>
                            </div>
                        </div>

                        <div class="text-[11px] text-slate-600 flex items-center justify-between pt-0.5">
                            <span>${escapeHtml(r.details || '')}</span>
                            ${r.expire_deadline && r.expire_deadline !== '-' ? `<span class="text-[10px] text-emerald-700 font-medium">${escapeHtml(r.expire_deadline)}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function copyActiveLinks() {
            const actives = allResults.filter(r => r.status === 'ACTIVE');
            if (actives.length === 0) { alert('没有有效链接！'); return; }
            const textLines = actives.map(r => `第 ${r.index} 条 (${r.remaining_time || '有效'}): ${r.url || r.raw_input}`).join('\n');
            navigator.clipboard.writeText(textLines).then(() => alert(`已复制 ${actives.length} 条有效链接！`));
        }

        function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => alert('链接已复制！')); }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
        function escapeJs(str) { if (!str) return ''; return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function openHelpModal() { document.getElementById('helpModal').classList.remove('hidden'); }
        function closeHelpModal() { document.getElementById('helpModal').classList.add('hidden'); }
    </script>
</body>
</html>
